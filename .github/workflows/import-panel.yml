name: Import Pterodactyl v1 source and apply INSANE_PANEL branding

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-panel.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout INSANE_PANEL
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download upstream Pterodactyl v1.15.2
        run: |
          git clone --depth 1 --branch v1.15.2 https://github.com/pterodactyl/panel.git /tmp/pterodactyl-upstream
          rsync -a --exclude=.git --exclude=.github /tmp/pterodactyl-upstream/ ./
      - name: Apply visible branding
        run: |
          python3 tools/brand.py
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Pterodactyl v1.15.2 source with INSANE_PANEL branding"
            git push origin HEAD:main
          fi
